{{ define "content" }}
<div class="max-w-md mx-auto my-auto px-4 py-16 w-full">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--bg-subtle)] text-[var(--text-main)] mb-4 border border-[var(--border-color)]">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-[var(--text-main)]">Admin Login</h1>
    <p class="text-sm text-[var(--text-muted)] mt-1">Sign in to manage monitors, status pages, and system settings.</p>
  </div>

  <div class="card p-6 shadow-xl">
    {{ if .Error }}
    <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-1">Username</label>
        <input type="text" id="username" name="username" required autofocus
               class="w-full px-3 py-2 bg-[var(--bg-subtle)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-1">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full px-3 py-2 bg-[var(--bg-subtle)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <button type="submit" class="w-full btn-primary py-2.5 text-sm mt-2">
        Sign In &rarr;
      </button>
    </form>
  </div>
</div>
{{ end }}
