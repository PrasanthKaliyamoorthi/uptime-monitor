{{ define "content" }}
<div class="max-w-md mx-auto my-auto px-4 py-16 w-full">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-4 border border-emerald-500/20">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-[var(--text-main)]">Initial Admin Setup</h1>
    <p class="text-sm text-[var(--text-muted)] mt-1">Create the master administrator account to initialize your uptime monitoring service.</p>
  </div>

  <div class="card p-6 shadow-xl">
    {{ if .Error }}
    <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/setup" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-1">Admin Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="admin"
               class="w-full px-3 py-2 bg-[var(--bg-subtle)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-1">Master Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••••••"
               class="w-full px-3 py-2 bg-[var(--bg-subtle)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-1">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••••••"
               class="w-full px-3 py-2 bg-[var(--bg-subtle)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <button type="submit" class="w-full btn-primary py-2.5 text-sm mt-2">
        Complete Initial Setup &rarr;
      </button>
    </form>
  </div>
</div>
{{ end }}
